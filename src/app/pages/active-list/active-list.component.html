<div class="info">
          <div class="table">
            <div class="head">
              <select name="kind" id="" [(ngModel)]="filter" (change)="activeFilter()">
                <option value="none">[Выберите вид]</option>
                <option [value]="item" *ngFor="let item of type_objects">{{item}}</option>
              </select>
              <button>Сохранить вид</button>
              <button>Сортировка</button>
              <button>Фильтрация</button>
              <button>Просмотреть архив</button>
              <button (click)="reload_list()">Обновить список</button>
              <button (click)="addActive()">Добавить актив</button>
            </div>
            <table>
              <thead>
                <tr>
                <th>Название</th>
                <th>Статус</th>
                <th>Дата создания</th>
                <th>Владелец</th>
                <th>Инвертарный номер</th>
                <th>Тип объекта</th>
                <th>Серийный номер</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of activites_list">
                    <th (click)="viewActive(item.name)">{{item.name}}</th>
                    <th>{{item.status}}</th>
                    <th>{{item.date_create}}</th>
                    <th [routerLink]="['/user-browse',item.owner]">{{item.owner}}</th>
                    <th>{{item.inventory_number}}</th>
                    <th>{{item.type_object}}</th>
                    <th>{{item.serial_number}}</th>
                </tr>
              </tbody>
            </table>
            </div>
